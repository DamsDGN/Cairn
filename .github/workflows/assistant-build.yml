name: assistant-build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win --config electron-builder.config.ts
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            args: --mac --config electron-builder.assistant.ts
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun ./scripts/prebuild.ts
        working-directory: packages/desktop
        env:
          OPENCODE_CLI_TARGET: ${{ matrix.target }}
      - run: bun run build
        working-directory: packages/desktop
      - run: bunx electron-builder ${{ matrix.args }}
        working-directory: packages/desktop
        env:
          OPENCODE_CLI_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: packages/desktop/dist/opencode-desktop-*

  release:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
