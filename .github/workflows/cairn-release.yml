name: cairn-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the cairn-v prefix (for example 0.2.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # One button: the requested version is written to the package, committed, tagged, and every later
  # job checks out that tag. The tag and the version cannot disagree, which is what the updater
  # compares.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # The version commit and its tag are pushed to main, which the branch rule protects. The default
      # GITHUB_TOKEN cannot bypass it, so a maintainer token granted the administrator bypass does the
      # push. It only needs `public_repo`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Validate the requested version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED#cairn-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a version: $version" >&2
            exit 1
          fi
          current="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "$version" != "$current" ] && [ "$version" != "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n 1)" ]; then
            echo "$version is older than the current $current" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=cairn-v$version" >> "$GITHUB_OUTPUT"

      # A retried run finds the package already bumped: it only recreates a missing tag, so the
      # button can be pressed again after a build failure without a second commit.
      - name: Bump the version and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          current="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "$current" != "$VERSION" ]; then
            node -e 'const fs = require("fs"); const file = "packages/desktop/package.json"; const pkg = JSON.parse(fs.readFileSync(file, "utf8")); pkg.version = process.env.VERSION; fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n")'
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/desktop/package.json
            git commit -m "chore(release): $VERSION"
            git push origin HEAD:main
          else
            echo "the package already carries $VERSION"
          fi
          if git rev-parse -q --verify "refs/tags/$TAG"; then
            echo "$TAG already exists"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"

  whisper:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      # The AVX2 addon is built against glibc 2.35 (Ubuntu 22.04) so the .deb and the AppImage stay
      # installable on every distribution Electron itself supports.
      - name: Build the AVX2 speech addon
        working-directory: packages/desktop
        run: bun run whisper:avx2
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-linux-x64-avx2
          if-no-files-found: error
          path: packages/desktop/resources/whisper-avx2/index.node

  desktop:
    needs: [prepare, whisper]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flag: --linux AppImage deb
            config: electron-builder.config.ts
            cli: opencode-linux-x64-baseline
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            flag: --win
            config: electron-builder.config.ts
            cli: opencode-windows-x64-baseline
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            flag: --mac --arm64
            config: electron-builder.assistant.ts
            cli: opencode-darwin-arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      OPENCODE_CHANNEL: prod
      OPENCODE_CLI_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      - name: Check the tag carries the released version
        run: test "$(node -p "require('./packages/desktop/package.json').version")" = "${{ needs.prepare.outputs.version }}"

      - name: Resolve the version
        run: node -e 'const p=require("./packages/desktop/package.json");require("fs").appendFileSync(process.env.GITHUB_ENV,"OPENCODE_VERSION=" + p.version + "\n")'

      # The desktop bundles the CLI built here, so the engine matches the tag. The target is the
      # CLI package name, not the Rust triple: desktop builds use the baseline (no AVX2) x64
      # binaries, the ones that run on every machine. The CLI is built without OPENCODE_CHANNEL so
      # a versioned build reports itself as `latest`, the release name of the engine; the desktop
      # app uses `prod` for its identity and its update feed.
      - name: Build the CLI
        run: bun packages/cli/script/build.ts --target=${{ matrix.cli }}
        env:
          OPENCODE_CHANNEL: ""

      - name: Fetch the AVX2 speech addon
        if: matrix.os == 'ubuntu-latest'
        uses: actions/download-artifact@v4
        with:
          name: whisper-linux-x64-avx2
          path: packages/desktop/resources/whisper-avx2

      - name: Prepare the desktop
        working-directory: packages/desktop
        run: bun ./scripts/prebuild.ts
        env:
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist

      - name: Build the desktop
        working-directory: packages/desktop
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist

      # The release job uploads the artifacts, so electron-builder must not publish on its own.
      - name: Package
        working-directory: packages/desktop
        run: bunx electron-builder ${{ matrix.flag }} --config ${{ matrix.config }} --publish never
        env:
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist

      # A packaging mistake would ship the portable addon only and nothing would look wrong, so the
      # unpacked application is checked for the optimized binary.
      - name: Check the Linux package carries the AVX2 addon
        if: matrix.os == 'ubuntu-latest'
        run: test -s packages/desktop/dist/linux-unpacked/resources/whisper-avx2/index.node

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest*.yml

  release:
    needs: [prepare, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Cairn ${{ needs.prepare.outputs.version }}
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          generate_release_notes: true
